<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Softphone</title>

<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: auto;
}

.softphone {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

h2 {
    margin-top: 0;
}

.status {
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-weight: bold;
}

.ready {
    background: #d4edda;
}

.calling {
    background: #fff3cd;
}

.error {
    background: #f8d7da;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    padding: 12px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    margin-right: 5px;
    margin-top: 5px;
}

.call-btn {
    background: #28a745;
    color: white;
}

.hangup-btn {
    background: #dc3545;
    color: white;
}

.answer-btn {
    background: #007bff;
    color: white;
}

.reject-btn {
    background: #6c757d;
    color: white;
}

.incoming-box {
    display: none;
    margin-top: 15px;
    padding: 15px;
    border-radius: 8px;
    background: #e2e3ff;
}
</style>
</head>

<body>

<div class="container">

    <div class="softphone">

        <h2>CRM Softphone</h2>

        <div id="status" class="status">
            Initializing...
        </div>

        <input
            type="text"
            id="phoneNumber"
            placeholder="+919784438550" value="+919784438550">

        <button
            class="call-btn"
            onclick="makeCall()">
            Call
        </button>

        <button
            class="hangup-btn"
            onclick="hangupCall()">
            Hang Up
        </button>

        <div
            id="incomingBox"
            class="incoming-box">

            <h3>Incoming Call</h3>

            <p>
                From:
                <span id="callerNumber"></span>
            </p>

            <button
                class="answer-btn"
                onclick="acceptCall()">
                Answer
            </button>

            <button
                class="reject-btn"
                onclick="rejectCall()">
                Reject
            </button>

        </div>

    </div>

</div>

<script>

let device;
let activeCall;
console.log(Twilio.Device.version);

async function initializePhone() {

    try {

        // Explicitly request mic permission
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        console.log("Microphone granted");

        const devices =
            await navigator.mediaDevices.enumerateDevices();

        console.table(devices);

        const response =
            await fetch('https://api.dev.rpmfy.com/crm-service/api/twilio/token');

        const data = await response.json();

        device = new Twilio.Device(data.token, {
            logLevel: 1,
            codecPreferences: ['pcmu']
        });

        device.on('registered', () => {
            console.log('Device registered');
        });

        device.on('error', (error) => {
            console.error('Device Error', error);
        });

        device.on('incoming', (call) => {
            console.log('Incoming Call');
            activeCall = call;
        });

        await device.register();

    } catch (error) {

        console.error(error);

        alert(
            'Microphone permission or device initialization failed'
        );
    }
}


async function initializePhone_old() {

   // try {

        updateStatus("Fetching Token...");

        const response = await fetch('https://api.dev.rpmfy.com/crm-service/api/twilio/token');

        const data = await response.json();
        device = new Twilio.Device(data.token, {
            logLevel: 1
        });

        device.on('registered', () => {
            updateStatus('Ready');
        });

        device.on('error', error => {
            console.error(error);
            updateStatus('Error: ' + error.message, 'error');
        });

        device.on('incoming', call => {

            activeCall = call;

            document.getElementById('callerNumber').innerText =
                call.parameters.From || 'Unknown';

            document.getElementById('incomingBox').style.display =
                'block';

            updateStatus('Incoming Call...', 'calling');

            attachCallEvents(call);
        });

        await device.register();

   // } catch (error) {

   //     console.error(error);

   //     updateStatus(
    //        'Initialization Failed',
    //        'error'
    //    );
   // }
}

async function makeCall() {

    const phone =
        document.getElementById('phoneNumber').value;

    if (!phone) {
        alert('Enter phone number');
        return;
    }

    try {

        updateStatus('Calling...', 'calling');

        activeCall = await device.connect({
            params: {
                phone: phone
            }
        });

        attachCallEvents(activeCall);

    } catch (error) {

        console.error(error);

        updateStatus(
            'Call Failed',
            'error'
        );
    }
}

function acceptCall() {

    if (activeCall) {
        activeCall.accept();
    }

    document.getElementById('incomingBox').style.display =
        'none';
}

function rejectCall() {

    if (activeCall) {
        activeCall.reject();
    }

    document.getElementById('incomingBox').style.display =
        'none';

    updateStatus('Ready');
}

function hangupCall() {

    if (activeCall) {
        activeCall.disconnect();
    }
}

function attachCallEvents(call) {

    call.on('accept', () => {

        updateStatus(
            'Connected',
            'calling'
        );

        console.log('Call Connected');
    });

    call.on('disconnect', () => {

        updateStatus(
            'Ready',
            'ready'
        );

        document.getElementById('incomingBox').style.display =
            'none';

        activeCall = null;

        console.log('Call Ended');
    });

    call.on('cancel', () => {

        updateStatus(
            'Call Cancelled',
            'ready'
        );

        document.getElementById('incomingBox').style.display =
            'none';

        activeCall = null;
    });

    call.on('reject', () => {

        updateStatus(
            'Call Rejected',
            'ready'
        );

        document.getElementById('incomingBox').style.display =
            'none';

        activeCall = null;
    });
}

function updateStatus(text, type = 'ready') {

    const status =
        document.getElementById('status');

    status.innerText = text;

    status.className =
        'status ' + type;
}

initializePhone();

</script>

</body>
</html>
